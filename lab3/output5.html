<!DOCTYPE html>
<html>
<body>
  <form oninput="z.value=parseInt(x.value)+parseInt(y.value); xVal.value=x.value">
    <input id="x" type="range" min="0" max="30" step="1" value="0"> 
    <output id="xVal" for="x">0</output>
    <br> +
    <input id="y" type="number" value="10">
    <br>=
    <output name="z" for="x y"></output>
  </form>
</body>
</html>
